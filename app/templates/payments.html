<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Page</title>
    <link rel="stylesheet" href="{{ css }}" />
    <style>
      /* Basic styling for layout and responsiveness */
      body {
        font-family: Arial, sans-serif;
        background-color: #dadbdc;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .payment-form {
        background: #ffffff;
        padding: 20px 30px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        max-width: 400px;
        width: 100%;
      }
      .payment-form h2 {
        margin-top: 0;
        text-align: center;
      }
      label {
        display: block;
        margin-top: 10px;
        font-weight: bold;
      }
      input[type="text"],
      input[type="email"],
      select {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
      }
      .card-details {
        display: flex;
        justify-content: space-between;
      }
      .card-details div {
        flex: 1;
      }
      .card-details div:first-child {
        margin-right: 10px;
      }
      .btn-pay {
        width: 100%;
        padding: 12px;
        background-color: #4caf50;
        color: #ffffff;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
        margin-top: 20px;
      }
      .btn-pay:hover {
        background-color: #45a049;
      }
      .security-note {
        text-align: center;
        font-size: 12px;
        color: #888;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="payment-form">
      <h2>Complete Your Payment</h2>
      <form action="/process_payment">
        <label for="name">Name on Card</label>
        <input type="text" id="name" name="name" required />

        <label for="card-number">Card Number</label>
        <input
          type="text"
          id="card-number"
          name="card-number"
          required
          pattern="\d{16}"
          placeholder="1234 5678 9012 3456"
        />

        <div class="card-details">
          <div>
            <label for="expiry-date">Expiry Date</label>
            <input
              type="text"
              id="expiry-date"
              name="expiry-date"
              required
              pattern="\d{2}/\d{2}"
              placeholder="MM/YY"
            />
          </div>
          <div>
            <label for="cvv">CVV</label>
            <input
              type="text"
              id="cvv"
              name="cvv"
              required
              pattern="\d{3}"
              placeholder="123"
            />
          </div>
        </div>

        <button type="submit" class="btn-pay">Pay Now</button>
      </form>
      <p class="security-note">
        Your payment information is encrypted and secure.
      </p>
    </div>
  </body>
</html>
